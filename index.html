<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0A0E17"/>
<title>Halbmarathon 2027 · Coach</title>
<link rel="icon" href="apple-touch-icon.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="HM 2027"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E17; --sur:#121927; --sur2:#1A2335; --line:#243046; --line2:#2E3D5C;
  --tx:#EEF2F9; --mut:#8493AD; --dim:#5C6A85;
  --acc:#FF7A3C; --acc2:#FFB25E; --grad:linear-gradient(120deg,#FF7A3C,#FFB25E);
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --row:#38BDF8; --vio:#C084FC;
  --r:16px; --rs:11px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{overflow-x:hidden;max-width:100vw}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
.num,.disp{font-family:"Sora",system-ui,sans-serif}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Cards & basics */
.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px}
.card.flat{padding:10px 12px}
.lbl{font-size:11px;color:var(--mut);letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--mut);background:var(--sur2)}
.zchip{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.2px}
input[type=text],input[type=number],input[type=date]{width:100%;padding:10px 12px;background:var(--sur2);border:1px solid var(--line);border-radius:var(--rs);color:var(--tx);font-size:15px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--acc)}

/* Header */
.hdr{position:sticky;top:0;z-index:60;background:rgba(10,14,23,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.hdr-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Bottom Nav */
.nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:70;display:flex;background:rgba(18,25,39,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);border-radius:20px;padding:5px;max-width:520px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border:none;background:none;border-radius:14px;color:var(--dim);font-size:9.5px;font-weight:600;transition:background .15s,color .15s}
.nav-btn .ic{font-size:17px;line-height:1;filter:grayscale(1) opacity(.7)}
.nav-btn.active{color:var(--acc);background:rgba(255,122,60,.12)}
.nav-btn.active .ic{filter:none}

/* Hero (Heute) */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 85% -20%,rgba(255,122,60,.22),rgba(255,178,94,.05) 45%,transparent 70%),var(--sur);border:1px solid var(--line2);border-radius:18px;padding:14px;margin-bottom:10px}
.ring{position:relative;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring::after{content:"";position:absolute;inset:5px;background:var(--sur);border-radius:50%}
.ring span{position:relative;z-index:1;font-weight:800;font-size:13px}
.coach{border-left:3px solid var(--acc);background:var(--sur2);border-radius:0 var(--rs) var(--rs) 0;padding:10px 12px;font-size:13px;color:var(--mut);line-height:1.55}

/* Sessions */
.ses{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px}
.check-btn{width:26px;height:26px;border-radius:9px;flex-shrink:0;border:2px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:transform .12s,background .15s,border-color .15s}
.check-btn:active{transform:scale(.85)}
.wu{display:flex;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--mut);line-height:1.5}
.wu:last-child{border-bottom:none}
.wu b{color:var(--tx);font-weight:600;flex-shrink:0;min-width:76px}
.exrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.exrow:last-child{border-bottom:none}

/* Plan list */
.week-card{margin-bottom:9px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--sur)}
.week-card.current{border-color:rgba(255,122,60,.55);box-shadow:0 0 0 1px rgba(255,122,60,.2)}
.week-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:none;border:none;text-align:left}
.session-row{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid rgba(36,48,70,.5)}
.session-row:last-child{border-bottom:none}
.pill{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--sur);color:var(--mut);font-size:12px;white-space:nowrap;font-weight:500}
.pill.active{font-weight:700}
.phase-filter{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.phase-filter::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--sur2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 0;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.active{background:var(--sur);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* Badges / charts */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.badge-card{border-radius:12px;padding:12px;border:1px solid var(--line);opacity:.38;transition:opacity .3s;background:var(--sur)}
.badge-card.earned{opacity:1;border-color:rgba(255,122,60,.35)}
.bar-chart{display:flex;align-items:flex-end;gap:3px;height:140px;overflow-x:auto;padding-bottom:26px;padding-top:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:20px}
.bar-label-top{font-size:8px;color:var(--dim)}
.bar-rect{width:16px;border-radius:3px 3px 0 0}
.bar-label-bot{font-size:8px;color:var(--dim);transform:rotate(-45deg);transform-origin:top left;width:24px;margin-top:2px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(4,7,13,.78);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal-box{background:#101726;border-radius:22px 22px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:520px;border:1px solid var(--line2);border-bottom:none;max-height:88vh;overflow-y:auto;animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.mood-btn{flex:1;font-size:22px;padding:9px 0;border-radius:12px;border:2px solid var(--line);background:none}
.mood-btn.selected{border-color:var(--acc);background:rgba(255,122,60,.14)}
input[type=range]{width:100%;accent-color:var(--acc);height:30px}
.btn{width:100%;padding:12px;border-radius:13px;border:none;background:var(--grad);color:#1A0D04;font-size:15px;font-weight:800}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mut);font-weight:600}
.btn:active{transform:scale(.985)}

@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.confetti-msg{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:999}

@media(max-width:370px){
  .disp{letter-spacing:-.2px}
  .badge-grid{grid-template-columns:1fr 1fr}
  .mood-btn{font-size:19px;padding:7px 0}
  .chip{padding:2px 8px;font-size:10px}
}
@media(min-width:880px){
  body{padding-bottom:24px}
  .nav{display:none}
  .layout{display:grid;grid-template-columns:1fr 1fr;max-width:1240px;margin:0 auto;gap:0}
  .left-col{border-right:1px solid var(--line);min-height:100vh}
  .badge-grid{grid-template-columns:repeat(3,1fr)}
  .dtabs{display:flex;border-bottom:1px solid var(--line)}
  .dtab-btn{flex:1;padding:12px 0;background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);font-size:13px;font-weight:500}
  .dtab-btn.active{border-bottom-color:var(--acc);color:var(--tx);font-weight:700}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Config ──────────────────────────────────────────────────────────────────
var PLAN_START = new Date(2026,6,13);   // Trainingsstart: Mo, 13. Juli 2026
var RACE_DATE  = new Date(2027,3,11);
var WEEKS      = 39;                    // 39 Wochen bis zum Rennen
var NEW_FROM   = 1;                     // Coach-Struktur ab Woche 1
var RESET_KEY  = "reset-2026-07-13";    // einmaliger Neustart-Marker
var EXAM_WEEK  = 1;                     // Prüfungswoche: harte Einheiten entschärfen
var LS_DATA="hm-data", LS_CFG="hm-cfg", TABLE="hm_training", LS_WEIGHT="hm-weight", LS_STEPS="hm-steps", LS_SUPP="hm-supp";
var SB_URL="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
var TESTS={8:3,14:5,20:5,26:5,32:5};    // Testlauf-Wochen → Distanz km
var DAYN=["Mo","Di","Mi","Do","Fr","Sa","So"];

var PC={1:"#60A5FA",2:"#34D399",3:"#FBBF24",4:"#F87171",5:"#C084FC"};
var SC={easy:"#C084FC",long:"#34D399",tempo:"#FBBF24",strength:"#FB923C",recovery:"#60A5FA",race:"#FF7A3C",rowing:"#22D3EE",test:"#F472B6"};
var SI={easy:"🏃🏻‍♀️",long:"🛤️",tempo:"⚡",strength:"💪",recovery:"🌿",race:"🏅",rowing:"🚣‍♀️",test:"⏱️"};
var MOODS=["😫","😕","😊","💪","🚀"];
var ZC=["#94A3B8","#38BDF8","#34D399","#FBBF24","#F87171"]; // Z1–Z5

// Supplements mit Timing-Empfehlungen (auf Jumana zugeschnitten: Training morgens, selten Fleisch)
var DEFAULT_SUPPS=[
  {id:"krea",name:"Kreatin-Monohydrat",dose:"3–5 g",icon:"⚡",when:"Täglich, Uhrzeit egal",
   tip:"Jeden Tag gleich – auch an Ruhetagen. Timing ist zweitrangig, Hauptsache konstant. Da du selten Fleisch isst, ist deine Nahrungszufuhr niedrig – du profitierst besonders. Anfangs 1–2 kg Wasser in der Muskelzelle (kein Fett!), dazu genug trinken.",clr:"#FB923C"},
  {id:"b12",name:"Vitamin-B-Komplex",dose:"1 Kapsel",icon:"🅱️",when:"Morgens zum Frühstück",
   tip:"Fettlöslich-unabhängig, aber morgens sinnvoll (kann wach machen – nicht abends). Für dich als Wenig-Fleisch-Esserin ist v. a. B12 relevant. Viele Komplexe sind stark überdosiert – 1×/Tag reicht völlig.",clr:"#60A5FA"},
  {id:"omega",name:"Omega-3",dose:"1–2 g EPA/DHA",icon:"🐟",when:"Zur größten Mahlzeit",
   tip:"Immer mit Fett/Essen einnehmen – deutlich bessere Aufnahme und weniger Aufstoßen. Bei dir mittags/abends zur Hauptmahlzeit ideal.",clr:"#38BDF8"},
  {id:"zink",name:"Zink",dose:"≤ 25 mg",icon:"🛡️",when:"Abends, nüchtern",
   tip:"Nicht zusammen mit dem Training-Kaffee oder Milchprodukten (hemmt Aufnahme). Nicht dauerhaft hoch dosieren – über Monate kann viel Zink Kupfermangel begünstigen. Abends mit etwas Abstand zu Magnesium.",clr:"#A78BFA"},
  {id:"mag",name:"Magnesiumglycinat",dose:"200–400 mg",icon:"🌙",when:"Abends vor dem Schlafen",
   tip:"Glycinat ist die gut verträgliche, schlaffreundliche Form – perfekt abends. Unterstützt Muskelentspannung nach dem Training und den Schlaf. Etwas zeitlichen Abstand zu Zink lassen.",clr:"#34D399"},
  {id:"ashwa",name:"Ashwagandha",dose:"300–600 mg",icon:"🌿",when:"Abends, als Kur",
   tip:"Optional. Standardisierter Extrakt (z. B. KSM-66). Kann Stress & Cortisol senken und den Schlaf verbessern – das unterstützt indirekt die Regeneration. Bewusst als Kur (6 Wochen ein / 4 Wochen Pause), nicht dauerhaft – die Langzeitsicherheit ist nicht gut untersucht. VORSICHT: nicht bei Schilddrüsenüberfunktion oder Schilddrüsen-Medikation, nicht bei Kinderwunsch/Schwangerschaft, mögliche Wechselwirkung mit Beruhigungs- und Schilddrüsenmitteln. Im Zweifel vorher ärztlich abklären.",clr:"#84CC16"},
];
// Kur-Zyklen: Supplements, die bewusst NICHT dauerhaft laufen (Wochen ein / Wochen Pause, wiederkehrend ab 'start')
var SUPP_CYCLE={
  zink: {start:"2026-07-20", on:8, off:4},   // Zink: 8 Wochen ein, 4 Wochen Pause
  ashwa:{start:"2026-07-20", on:6, off:4},   // Ashwagandha: 6 Wochen ein, 4 Wochen Pause
};

var PHASES=[
  {id:1,name:"Fundament",wStart:1,wEnd:10},
  {id:2,name:"Basis",wStart:11,wEnd:18},
  {id:3,name:"Qualität",wStart:19,wEnd:28},
  {id:4,name:"Race Prep",wStart:29,wEnd:36},
  {id:5,name:"Tapering",wStart:37,wEnd:39},
];

// ── Kraft-Workouts ────────────────────────────────────────────────────────────
function kraftEx(variant,phId){
  var maint=phId>=4, sets=maint?"2":"3";
  if(variant==="A")return[
    {id:"a1",n:"Goblet Squat",s:sets+"×8–10",tip:"KB vor der Brust · tief, Fersen unten"},
    {id:"a2",n:"Liegestütze (erhöht)",s:sets+"×8–12",tip:"Hände erhöht · Körper wie ein Brett · mit der Zeit tiefer"},
    phId<3?{id:"a3",n:"KB Deadlift",s:sets+"×10–12",tip:"Hüfte nach hinten schieben · Rücken lang"}:{id:"a3",n:"KB Swings",s:sets+"×15",tip:"Hüftschnappen, kein Squat · Arme locker"},
    {id:"a4",n:"Farmers Carry",s:sets+"×30–40 Sek",tip:"Beidhändig · aufrecht, Schultern tief"}];
  return[
    {id:"b1",n:"Ausfallschritte rückwärts",s:sets+"×6–8/Bein",tip:"Rückwärts = knieschonender · erst ohne Gewicht"},
    {id:"b2",n:"Einarmiges KB-Rudern",s:sets+"×10/Seite",tip:"Hand aufgestützt · Ellbogen zur Hüfte ziehen"},
    phId<3?{id:"b3",n:"KB Deadlift",s:sets+"×12",tip:"Hip Hinge festigen – Basis für Swings"}:{id:"b3",n:"KB Swings",s:sets+"×12–15",tip:"Explosiv aus der Hüfte · Rumpf fest"},
    {id:"b4",n:"Suitcase Carry",s:sets+"×30 Sek/Seite",tip:"Einarmig · nicht zur Seite kippen – Rumpf!"}];
}

// ── Badges ────────────────────────────────────────────────────────────────────
function isRun(s){return s.type!=="rowing"&&s.type!=="race"&&!(s.type==="strength"&&s.week>=NEW_FROM);}
var RUN_BADGES=[
  {id:"first",icon:"🚀",name:"Erste Schritte",desc:"Erste Lauf-Einheit abgehakt",ok:function(d,ds){return ds.filter(isRun).length>=1;}},
  {id:"5km",icon:"📏",name:"5 km Marke",desc:"5 km in einem Lauf",ok:function(d,ds){return ds.filter(isRun).some(function(s){return parseFloat((d[s.id]&&d[s.id].km)||0)>=5;});}},
  {id:"10km",icon:"🏅",name:"10 km Marke",desc:"10 km in einem Lauf",ok:function(d,ds){return ds.filter(isRun).some(function(s){return parseFloat((d[s.id]&&d[s.id].km)||0)>=10;});}},
  {id:"15km",icon:"🛤️",name:"15 km Hürde",desc:"15 km in einem Lauf",ok:function(d,ds){return ds.filter(isRun).some(function(s){return parseFloat((d[s.id]&&d[s.id].km)||0)>=15;});}},
  {id:"tempo",icon:"⚡",name:"Tempo-Läuferin",desc:"Ersten Tempolauf absolviert",ok:function(d,ds){return ds.some(function(s){return s.type==="tempo";});}},
  {id:"test1",icon:"⏱️",name:"Standort bestimmt",desc:"Ersten Testlauf absolviert",ok:function(d,ds){return ds.some(function(s){return s.type==="test";});}},
  {id:"s10",icon:"💪",name:"10 Läufe",desc:"10 Lauf-Einheiten abgehakt",ok:function(d,ds){return ds.filter(isRun).length>=10;}},
  {id:"s25",icon:"🌟",name:"25 Läufe",desc:"25 Lauf-Einheiten abgehakt",ok:function(d,ds){return ds.filter(isRun).length>=25;}},
  {id:"str3",icon:"🔥",name:"3 Wochen Streak",desc:"3 Wochen vollständig",ok:function(d,ds,all,sk){return sk>=3;}},
  {id:"str5",icon:"🔥🔥",name:"5 Wochen Streak",desc:"5 Wochen vollständig",ok:function(d,ds,all,sk){return sk>=5;}},
  {id:"ph1",icon:"1️⃣",name:"Phase 1 ✓",desc:"Fundament-Phase abgeschlossen",ok:function(d,ds,all){var p=all.filter(function(s){return getPh(s.week).id===1&&!s.optional&&s.type!=="race";});return p.length>0&&p.every(function(s){return d[s.id]&&d[s.id].done;});}},
  {id:"half",icon:"💯",name:"Halbzeit!",desc:"50% des Plans absolviert",ok:function(d,ds,all){var c=all.filter(function(s){return !s.optional&&s.type!=="race";}).length;return ds.filter(function(s){return !s.optional&&s.type!=="race";}).length>=c/2;}},
];
var ROW_BADGES=[
  {id:"row1",icon:"🚣‍♀️",name:"Erste Ruder-Einheit",desc:"Erste Ruder-Einheit abgehakt",ok:function(d,ds){return ds.filter(function(s){return s.type==="rowing";}).length>=1;}},
  {id:"row5km",icon:"📏",name:"5 km Rudern",desc:"5 km in einer Ruder-Einheit",ok:function(d,ds){return ds.filter(function(s){return s.type==="rowing";}).some(function(s){return parseFloat((d[s.id]&&d[s.id].km)||0)>=5;});}},
  {id:"row10km",icon:"🏅",name:"10 km Rudern",desc:"10 km in einer Ruder-Einheit",ok:function(d,ds){return ds.filter(function(s){return s.type==="rowing";}).some(function(s){return parseFloat((d[s.id]&&d[s.id].km)||0)>=10;});}},
  {id:"row10",icon:"🚣‍♀️",name:"10 Ruder-Einheiten",desc:"10 Ruder-Einheiten abgehakt",ok:function(d,ds){return ds.filter(function(s){return s.type==="rowing";}).length>=10;}},
  {id:"row25",icon:"💪",name:"25 Ruder-Einheiten",desc:"25 Ruder-Einheiten abgehakt",ok:function(d,ds){return ds.filter(function(s){return s.type==="rowing";}).length>=25;}},
  {id:"rowkm50",icon:"🌊",name:"50 km Gesamt",desc:"50 km gerudert insgesamt",ok:function(d,ds){var t=ds.filter(function(s){return s.type==="rowing";}).reduce(function(a,s){return a+parseFloat((d[s.id]&&d[s.id].km)||0);},0);return t>=50;}},
];
var KRAFT_BADGES=[
  {id:"k1",icon:"🏋️‍♀️",name:"Erste Kraft-Einheit",desc:"Erstes Kettlebell-Workout abgehakt",ok:function(d,ds){return ds.filter(function(s){return s.type==="strength"&&s.week>=NEW_FROM;}).length>=1;}},
  {id:"k10",icon:"💪",name:"10 Kraft-Einheiten",desc:"10 Workouts abgehakt",ok:function(d,ds){return ds.filter(function(s){return s.type==="strength"&&s.week>=NEW_FROM;}).length>=10;}},
  {id:"k25",icon:"🦾",name:"25 Kraft-Einheiten",desc:"25 Workouts abgehakt",ok:function(d,ds){return ds.filter(function(s){return s.type==="strength"&&s.week>=NEW_FROM;}).length>=25;}},
  {id:"kup",icon:"📈",name:"Progression",desc:"Gewicht bei einer Übung gesteigert",ok:function(d,ds){var seen={};var up=false;ds.filter(function(s){return s.type==="strength";}).sort(function(a,b){return a.week-b.week;}).forEach(function(s){var e=d[s.id];if(!e||!e.ex)return;for(var k in e.ex){var v=parseFloat(e.ex[k]);if(!v)continue;if(seen[k]&&v>seen[k])up=true;seen[k]=v;}});return up;}},
];
var BADGES=RUN_BADGES.concat(ROW_BADGES).concat(KRAFT_BADGES);

// ── Helpers ──────────────────────────────────────────────────────────────────
function getPh(w){return PHASES.find(function(p){return w>=p.wStart&&w<=p.wEnd;})||PHASES[4];}
function lerp(a,b,t){return Math.round(a+(b-a)*Math.max(0,Math.min(1,t)));}
function getCurWeek(){var ms=new Date().getTime()-PLAN_START.getTime();return Math.max(1,Math.min(WEEKS,Math.floor(ms/(7*24*3600*1000))+1));}
function daysLeft(){return Math.max(0,Math.ceil((RACE_DATE.getTime()-new Date().getTime())/(24*3600*1000)));}
function wkRange(w){
  var s=new Date(PLAN_START);s.setDate(s.getDate()+(w-1)*7);
  var e=new Date(s);e.setDate(e.getDate()+6);
  function f(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"short"});}
  return f(s)+" – "+f(e);
}
function sesDate(w,day){var d=new Date(PLAN_START);d.setDate(d.getDate()+(w-1)*7+(day!=null?day:3));return d;}
function todayIdx(){return (new Date().getDay()+6)%7;} // Mo=0
function mkUID(){return "u-"+Math.random().toString(36).slice(2,10);}
function lsGet(k,fb){try{var r=localStorage.getItem(k);return r?JSON.parse(r):(fb!==undefined?fb:null);}catch(e){return fb!==undefined?fb:null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function parseDur(str){
  if(!str)return null;
  var p=str.trim().split(":").map(Number);
  if(p.some(isNaN)||p.length<2)return null;
  return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];
}
function fmtPace(s){var m=Math.floor(s/60),sc=Math.round(s%60);if(sc===60){m++;sc=0;}return m+":"+(("0"+sc).slice(-2));}
function fmtTime(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=Math.round(s%60);return h>0?h+":"+(("0"+m).slice(-2))+":"+(("0"+sc).slice(-2)):m+":"+(("0"+sc).slice(-2));}

// ── Profil, HF-Zonen, Paces, Prognose ────────────────────────────────────────
function profile(){return (STATE.data&&STATE.data.profile)||null;}
function hrZones(){
  var p=profile();if(!p||!p.age||!p.rhr)return null;
  var max=p.maxhr||Math.round(208-0.7*p.age), hrr=max-p.rhr;
  function z(a,b){return Math.round(p.rhr+hrr*a)+"–"+Math.round(p.rhr+hrr*b);}
  return {max:max,bands:[z(.5,.6),z(.6,.7),z(.7,.8),z(.8,.9),z(.9,1)]};
}
function zoneChip(zi){ // zi: 1..5 oder [a,b]
  var lo=Array.isArray(zi)?zi[0]:zi, hi=Array.isArray(zi)?zi[1]:zi;
  var zs=hrZones(), c=ZC[hi-1];
  var lblZ="Z"+(lo===hi?lo:lo+"–"+hi);
  var bpm=zs?(" · "+(lo===hi?zs.bands[lo-1]:zs.bands[lo-1].split("–")[0]+"–"+zs.bands[hi-1].split("–")[1])+" bpm"):"";
  return '<span class="zchip" style="background:'+c+'22;color:'+c+'">'+lblZ+bpm+'</span>';
}
// Letzter Testlauf (oder Lauf ≥4 km mit Zeit) → Pace & HM-Prognose (Riegel)
var _fitCache;      // memo, wird bei Datenänderung invalidiert
var _fitBusy=false; // Reentranz-Schutz (fitness → allSessions → paces → fitness)
function invalidateFit(){_fitCache=undefined;}
function fitness(){
  if(_fitCache!==undefined)return _fitCache;
  if(_fitBusy)return null;
  _fitBusy=true;
  var list=allSessions();
  _fitBusy=false;
  var best=null;
  list.forEach(function(s){
    if(s.type==="rowing"||s.type==="strength"||s.type==="race")return;
    var e=STATE.data[s.id];if(!e||!e.done)return;
    var sec=parseDur(e.time),km=parseFloat(e.km);
    if(!sec||!km||km<3)return;
    if(s.type!=="test"&&km<4)return;
    var when=s.week*10+(s.day!=null?s.day:3);
    if(!best||when>=best.when)best={when:when,week:s.week,sec:sec,km:km,pace:sec/km,test:s.type==="test"};
  });
  if(best){
    best.hmSec=best.sec*Math.pow(21.0975/best.km,1.06);
    best.hmPace=best.hmSec/21.0975;
  }
  _fitCache=best;
  return best;
}
function paces(){
  var f=fitness();
  if(f)return {tempo:fmtPace(f.hmPace),easy:fmtPace(f.hmPace+80)+"–"+fmtPace(f.hmPace+100),long:fmtPace(f.hmPace+50)+"–"+fmtPace(f.hmPace+70),src:"test"};
  return {tempo:"4:58",easy:"6:30–7:00",long:"6:00–6:30",src:"default"};
}

// ── Sessions: Coach-Struktur ──────────────────────────────────────────────────
function adjOf(w){return STATE.data["adj:w"+w]||null;}
function genSesNew(w){
  var ph=getPh(w),t=(w-ph.wStart)/Math.max(ph.wEnd-ph.wStart,1);
  var adj=adjOf(w),m=(adj&&adj.m)||1;
  var P=paces();
  function dur(x){return Math.max(15,Math.round((x*m)/5)*5);}
  var ses=[];
  function add(sid,day,type,title,desc,min,zone,opt){
    var s={id:"w"+w+"-"+sid,type:type,title:title,desc:desc,min:min,zone:zone,day:day};
    if(opt)s.optional=true;
    ses.push(s);
  }
  function kraft(sid,day,variant){
    var maint=ph.id>=4;
    add(sid,day,"strength","Kraft "+variant+" – Kettlebell",
      (maint?"Erhaltung: 2 Sätze je Übung":"4 Übungen · 3 Sätze")+" · ~"+(maint?25:35)+" Min · Details in der Einheit",
      maint?25:35,null,false);
    ses[ses.length-1].workout=variant;
  }
  var testKm=TESTS[w];
  // ── Woche 49: Race Week ──
  if(w===WEEKS){
    add("1",1,"easy","Aktivierung","20 Min sehr locker "+"· 4×20 Sek flotte Steigerungen · Beine frisch halten",20,[1,2]);
    add("2",3,"recovery","Lockerer Spaziergang / Mobilität","20–30 Min · Beine lockern · früh schlafen",25,1,true);
    add("race",6,"race","🏅 HALBMARATHON!","11. April 2027 · Zieltempo "+P.tempo+"/km · Erste 5 km bewusst ruhig – du hast das trainiert!",105,[3,4]);
    return ses;
  }
  // ── Tapering 47–48 ──
  if(ph.id===5){
    var tp=w===37?0:1;
    if(w===37)kraft("k1",0,"A");
    add("2",1,"tempo","Kurzes Tempo",dur(lerp(10,8,tp))+" Min Einlaufen · "+(w===37?"6":"4")+"×2 Min @ "+P.tempo+"/km · 2 Min Trabpause · 10 Min Auslaufen",dur(lerp(35,28,tp)),4);
    add("r1",2,"rowing","Rudern – ganz locker",dur(20)+" Min ruhig · Schlagzahl 18–20 · nur Bewegung",20,1);
    add("3",3,"easy","Lockerlauf",dur(lerp(30,25,tp))+" Min sehr locker @ "+P.easy+"/km",dur(lerp(30,25,tp)),[1,2]);
    add("4",5,"easy","Lockerlauf",dur(lerp(40,30,tp))+" Min locker @ "+P.easy+"/km · Rennschuhe testen",dur(lerp(40,30,tp)),2);
    return ses;
  }
  // ── Phase 1: Grundlagenfitness – Rudern + Kettlebell zuerst, Laufen ab Woche 6 ──
  if(ph.id===1){
    kraft("k1",0,"A");
    if(w>=6){
      // Laufen wird ab Woche 6 behutsam eingeführt
      if(testKm)add("t",1,"test",testKm+"-km-Testlauf","10 Min locker einlaufen · "+testKm+" km gleichmäßig zügig (anstrengend, aber durchhaltbar) · 10 Min auslaufen · Zeit + km eintragen!",40,[4,5]);
      else add("1",1,"easy","Lauf – Einstieg (locker)",dur(lerp(18,28,(w-6)/4))+" Min sehr locker · Gehpausen erlaubt @ "+P.easy+"/km · vorher 10 Min Beckenboden",dur(lerp(18,28,(w-6)/4)),[1,2]);
    } else {
      // Woche 1–5: reines Rudern + Kettlebell, noch kein Laufen
      add("re",1,"rowing","Rudern – Intervall","5 Min einfahren · "+lerp(3,6,t)+"×2 Min zügig · 90 Sek locker · 5 Min ausfahren",dur(lerp(22,30,t)),4);
    }
    add("r1",2,"rowing","Rudern – Steady",dur(lerp(25,35,t))+" Min gleichmäßig · Schlagzahl 20–22 · Gespräch möglich",dur(lerp(25,35,t)),[2,3]);
    kraft("k2",3,"B");
    add("r2",4,"rowing","Rudern – locker",dur(20)+" Min ruhig · Technik-Fokus: erst Beine, dann Arme",dur(20),[1,2],true);
    if(w>=8)add("2",5,"easy","Lockerlauf",dur(lerp(25,35,(w-8)/2))+" Min locker @ "+P.easy+"/km",dur(lerp(25,35,(w-8)/2)),2);
    else add("rl",5,"rowing","Rudern – locker & lang",dur(lerp(30,45,t))+" Min ruhig · lockeres Grundlagentempo",dur(lerp(30,45,t)),[1,2]);
    return ses;
  }
  // ── Phase 2: Basis ──
  if(ph.id===2){
    kraft("k1",0,"A");
    if(testKm)add("t",1,"test",testKm+"-km-Testlauf","10 Min locker einlaufen · "+testKm+" km so schnell wie gleichmäßig möglich · 10 Min auslaufen · Zeit + km eintragen!",45,[4,5]);
    else add("1",1,"easy","Lockerlauf",dur(lerp(35,45,t))+" Min locker @ "+P.easy+"/km · entspannt bleiben",dur(lerp(35,45,t)),2);
    if(w%2===0)add("r1",2,"rowing","Rudern – Intervall","5 Min einfahren · "+lerp(4,6,t)+"×2 Min zügig · 90 Sek locker · 5 Min ausfahren (~"+dur(lerp(25,35,t))+" Min)",dur(lerp(25,35,t)),4);
    else add("r1",2,"rowing","Rudern – Steady",dur(lerp(30,40,t))+" Min gleichmäßig mittlere Intensität · aerobes Fundament",dur(lerp(30,40,t)),[2,3]);
    kraft("k2",3,"B");
    add("r2",4,"rowing","Rudern – locker",dur(20)+" Min ruhig · aktive Erholung",dur(20),[1,2],true);
    var lm=dur(lerp(60,85,t));
    add("3",5,"long","Langer Lauf",lm+" Min sehr locker @ "+P.long+"/km · Tempo egal, Dauer zählt",lm,2);
    return ses;
  }
  // ── Phase 3: Qualität ──
  if(ph.id===3){
    kraft("k1",0,"A");
    if(testKm)add("t",1,"test",testKm+"-km-Testlauf","10 Min einlaufen · "+testKm+" km gleichmäßig hart · 10 Min auslaufen · Zeit + km eintragen – dein Tempogerüst wird neu berechnet!",45,[4,5]);
    else add("1",1,"tempo","Tempolauf","10 Min einlaufen · "+(t<0.5?"4×6":"5×8")+" Min @ "+P.tempo+"/km · 2 Min Trabpause · 10 Min auslaufen",dur(t<0.5?50:65),4);
    add("r1",2,"rowing","Rudern – Intervall","5 Min einfahren · "+lerp(4,8,t)+"×500 m zügig · 90 Sek Pause · 5 Min ausfahren",dur(lerp(25,40,t)),4);
    kraft("k2",3,"B");
    add("2",4,"easy","Lockerlauf",dur(lerp(35,45,t))+" Min locker @ "+P.easy+"/km",dur(lerp(35,45,t)),2,true);
    var lm3=dur(lerp(70,95,t));
    add("3",5,"long","Langer Lauf",lm3+" Min locker @ "+P.long+"/km · letzte 10 Min etwas zügiger",lm3,2);
    add("r2",6,"rowing","Rudern – regenerativ",dur(20)+" Min ganz ruhig · lockert die Beine nach dem langen Lauf",dur(20),1,true);
    return ses;
  }
  // ── Phase 4: Race Prep ──
  kraft("k1",0,"A");
  if(testKm)add("t",1,"test",testKm+"-km-Testlauf","10 Min einlaufen · "+testKm+" km all-out gleichmäßig · 10 Min auslaufen · Generalprobe fürs Renntempo!",45,[4,5]);
  else add("1",1,"tempo","Renntempo","10 Min einlaufen · "+dur(lerp(25,35,t))+" Min @ "+P.tempo+"/km · 10 Min auslaufen",dur(lerp(45,55,t)),[3,4]);
  add("r1",2,"rowing","Rudern – Steady",dur(lerp(30,35,t))+" Min gleichmäßig · Beine schonen, Motor laufen lassen",dur(lerp(30,35,t)),[2,3]);
  kraft("k2",3,"B");
  add("2",4,"easy","Lockerlauf",dur(lerp(35,40,t))+" Min locker @ "+P.easy+"/km",dur(lerp(35,40,t)),2,true);
  var km4=Math.round(lerp(14,19,t)*m);
  add("3",5,"long","Langer Lauf",km4+" km locker @ "+P.long+"/km · mittlere 5 km im Renntempo üben (ab W40)",Math.round(km4*6.2),2);
  add("r2",6,"rowing","Rudern – locker",dur(20)+" Min ruhig · aktive Erholung",dur(20),1,true);
  return ses;
}
function easeExamWeek(w,ses){
  if(w!==EXAM_WEEK)return ses;
  ses.forEach(function(s){
    // Kraft & harte Einheiten in der Prüfungswoche optional machen
    if(s.type==="strength"||s.type==="tempo"||s.type==="test"){
      s.optional=true;
      s.examEased=true;
    }
  });
  return ses;
}
function genSes(w){return easeExamWeek(w,genSesNew(w));}
function allSessions(){var a=[];for(var w=1;w<=WEEKS;w++)genSes(w).forEach(function(s){a.push(Object.assign({},s,{week:w}));});return a;}

function calcStreak(data){
  var cur=getCurWeek(),streak=0;
  for(var w=cur;w>=1;w--){
    var req=genSes(w).filter(function(s){return !s.optional&&s.type!=="race";});
    if(req.length>0&&req.every(function(s){return data[s.id]&&data[s.id].done;})){streak++;}
    else{break;}
  }
  return streak;
}

// ── Supabase (lazy) ──────────────────────────────────────────────────────────
function initSupabase(cb){
  if(window.supabase){cb(window.supabase);return;}
  var s=document.createElement("script");
  s.src=SB_URL;
  s.onload=function(){cb(window.supabase||{});};
  s.onerror=function(){cb({});};
  document.head.appendChild(s);
}
function connectSupabase(){
  if(!STATE.cfg)return;
  initSupabase(function(lib){
    var fn=lib.createClient||(lib.default&&lib.default.createClient);
    if(!fn)return;
    STATE.sbClient=fn(STATE.cfg.url,STATE.cfg.key);
    loadFromSupabase();
  });
}
function loadFromSupabase(){
  if(!STATE.sbClient||!STATE.cfg)return;
  STATE.syncSt="syncing";render();
  STATE.sbClient.from(TABLE).select("data").eq("user_id",STATE.cfg.userId).single()
    .then(function(res){
      if(!res.error&&res.data&&res.data.data&&Object.keys(res.data.data).length>0){
        if(res.data.data[RESET_KEY]){ // Remote kennt den Neustart → übernehmen
          STATE.data=res.data.data;lsSet(LS_DATA,STATE.data);invalidateFit();
        } else { // Alte Daten in der Cloud → lokalen Neustart hochladen
          syncToSupabase();
        }
      }
      STATE.syncSt="ok";render();
    }).catch(function(){STATE.syncSt="error";render();});
}
function syncToSupabase(){
  if(!STATE.sbClient||!STATE.cfg)return;
  clearTimeout(STATE.syncTimer);
  STATE.syncTimer=setTimeout(function(){
    STATE.syncSt="syncing";render();
    STATE.sbClient.from(TABLE).upsert({user_id:STATE.cfg.userId,data:STATE.data})
      .then(function(res){STATE.syncSt=res.error?"error":"ok";render();})
      .catch(function(){STATE.syncSt="error";render();});
  },1200);
}
function saveData(){invalidateFit();lsSet(LS_DATA,STATE.data);syncToSupabase();}

// ── Coach-Engine: Belastung & automatische Anpassung ─────────────────────────
function rpeOf(e){
  if(e&&e.rpe)return e.rpe;
  if(e&&e.mood)return [8,6.5,5,4.5,4][e.mood-1]||5;
  return 5;
}
// Session-Loads (sRPE = Minuten × RPE) mit Datum, nur erledigte Einheiten
function loadEvents(){
  var ev=[];
  allSessions().forEach(function(s){
    var e=STATE.data[s.id];
    if(!e||!e.done||s.type==="race")return;
    var min=parseDur(e.time);min=min?min/60:(s.min||30);
    ev.push({d:sesDate(s.week,s.day),load:min*rpeOf(e)});
  });
  return ev;
}
// Akut-/Chronisch-Quote (7 Tage vs. Ø der letzten 28 Tage)
function loadRatio(ref){
  ref=ref||new Date();
  var ev=loadEvents(),acute=0,chronic=0,DAY=86400000;
  ev.forEach(function(x){
    var age=(ref-x.d)/DAY;
    if(age>=0&&age<7)acute+=x.load;
    if(age>=0&&age<28)chronic+=x.load;
  });
  chronic=chronic/4;
  if(chronic<60)return null; // zu wenig Daten
  return {acute:Math.round(acute),chronic:Math.round(chronic),r:acute/chronic};
}
function ampel(){
  var lr=loadRatio();
  if(!lr)return {c:"#5C6A85",t:"Belastung: zu wenig Daten",s:"–"};
  if(lr.r>1.4)return {c:"var(--bad)",t:"Belastung stark gestiegen ("+lr.r.toFixed(2)+") – Vorsicht",s:"Rot",lr:lr};
  if(lr.r>1.15)return {c:"var(--warn)",t:"Belastung steigt zügig ("+lr.r.toFixed(2)+")",s:"Gelb",lr:lr};
  return {c:"var(--ok)",t:"Belastung im grünen Bereich ("+lr.r.toFixed(2)+")",s:"Grün",lr:lr};
}
// Wochenerfüllung (Pflicht-Einheiten)
function weekCompletion(w){
  var req=genSes(w).filter(function(s){return !s.optional&&s.type!=="race";});
  if(req.length===0)return null;
  var dn=req.filter(function(s){return STATE.data[s.id]&&STATE.data[s.id].done;}).length;
  return dn/req.length;
}
// Einmal pro Woche: Anpassung berechnen & speichern (deterministisch)
function ensureCoach(){
  var w=getCurWeek();
  if(w>=WEEKS)return;
  if(STATE.data["adj:w"+w])return;
  // Prüfungswoche: Sonderbehandlung – Erholung & Schlaf haben Vorrang
  if(w===EXAM_WEEK){
    STATE.data["adj:w"+w]={m:1,exam:true,r:null,ts:new Date().toISOString().slice(0,10),
      note:"Prüfungswoche – dein Kopf hat Vorrang. 🧠 Kraft- und harte Einheiten sind diese Woche optional (grau markiert); mach sie nur, wenn du dich frisch fühlst. Was jetzt wirklich zählt: Schlaf (die stärkste Lern-Konsolidierung!) und Stress rauslassen. Ein lockerer Zone-2-Lauf oder ruhiges Rudern macht den Kopf frei, ohne zu ermüden. Verpasste Einheiten sind völlig okay – der Plan wartet auf dich. Und dein Kreatin (4 g) einfach täglich weiterlaufen lassen. Toi, toi, toi! 🍀"};
    saveData();return;
  }
  var ref=new Date(PLAN_START);ref.setDate(ref.getDate()+(w-1)*7); // Wochenstart
  var lr=loadRatio(ref);
  var prevComp=w>1?weekCompletion(w-1):null;
  // Ø-RPE der letzten 14 Tage
  var sum=0,n=0,DAY=86400000;
  allSessions().forEach(function(s){
    var e=STATE.data[s.id];if(!e||!e.done)return;
    var age=(ref-sesDate(s.week,s.day))/DAY;
    if(age>=0&&age<14){sum+=rpeOf(e);n++;}
  });
  var avgRpe=n>0?sum/n:null;
  var m=1,note;
  if(lr&&lr.r>1.4){m=0.75;note="Deine Belastung ist zuletzt stark gestiegen (Quote "+lr.r.toFixed(2)+"). Ich habe die Umfänge diese Woche um ~25 % reduziert – lieber ein Schritt zurück als drei Wochen Pause.";}
  else if(lr&&lr.r>1.15){m=1;note="Die Belastung steigt gerade zügig (Quote "+lr.r.toFixed(2)+"). Diese Woche halten wir das Niveau – keine zusätzliche Steigerung.";}
  else if(avgRpe!==null&&avgRpe<=4.5&&prevComp!==null&&prevComp>=0.9&&lr){m=1.05;note="Die letzten Wochen liefen stark und fühlten sich locker an (Ø-Anstrengung "+avgRpe.toFixed(1)+"/10). Ich habe die Umfänge leicht angehoben (+5 %).";}
  else if(avgRpe!==null&&avgRpe>=7.5){m=0.9;note="Die letzten Einheiten waren durchweg sehr anstrengend (Ø "+avgRpe.toFixed(1)+"/10). Ich nehme diese Woche ~10 % raus, damit du dich erholst.";}
  else{note="Alles im Plan – diese Woche läuft wie vorgesehen. Fokus: die Qualitätseinheiten (Tempo & langer Lauf) sauber durchziehen.";}
  if(prevComp!==null&&prevComp<0.6){note+=" Letzte Woche sind Einheiten ausgefallen – nicht nachholen! Qualität hat Vorrang, Optionales darf wegfallen.";}
  STATE.data["adj:w"+w]={m:m,note:note,r:lr?parseFloat(lr.r.toFixed(2)):null,ts:new Date().toISOString().slice(0,10)};
  saveData();
}

function todayKey(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function isoOf(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function suppCycleState(id){
  var c=SUPP_CYCLE[id];
  if(!c)return {active:true};
  var DAY=86400000,start=new Date(c.start+"T00:00:00").getTime(),now=new Date(todayKey()+"T00:00:00").getTime();
  if(now<start)return {active:false,resume:c.start};
  var period=(c.on+c.off)*7*DAY,onMs=c.on*7*DAY,into=(now-start)%period;
  if(into<onMs)return {active:true,pauseAt:isoOf(new Date(now+(onMs-into)))};
  return {active:false,resume:isoOf(new Date(now+(period-into)))};
}
function suppActive(sp){return suppCycleState(sp.id).active;}
function fmtDay(s){try{return new Date(s+"T00:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short",year:"numeric"});}catch(e){return s;}}
function suppTakenToday(id){
  var day=STATE.supp.log[todayKey()];

function toggleSupp(id){
  var sp=STATE.supp.list.filter(function(s){return s.id===id;})[0];
  if(sp&&!suppActive(sp))return;   // pausierte Supplements (z. B. Zink) noch nicht abhakbar
  var k=todayKey();
  if(!STATE.supp.log[k])STATE.supp.log[k]=[];
  var arr=STATE.supp.log[k],i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1);else arr.push(id);
  lsSet(LS_SUPP,STATE.supp);
}
function suppStreak(){
  // aufeinanderfolgende Tage rückwärts, an denen ALLE Supplements genommen wurden
  var ids=STATE.supp.list.filter(suppActive).map(function(s){return s.id;});
  if(ids.length===0)return 0;
  var streak=0,d=new Date();
  for(var i=0;i<400;i++){
    var k=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    var day=STATE.supp.log[k]||[];
    var allTaken=ids.every(function(id){return day.indexOf(id)>=0;});
    if(allTaken){streak++;}
    else if(i===0){/* heute noch nicht komplett – zählt nicht als Bruch */}
    else{break;}
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function suppTakenCountToday(){
  var day=STATE.supp.log[todayKey()]||[];
  return STATE.supp.list.filter(function(s){return suppActive(s)&&day.indexOf(s.id)>=0;}).length;

function lastWeights(variant,beforeWeek){
  var res={},resWeek={};
  allSessions().forEach(function(s){
    if(s.type!=="strength"||s.workout!==variant||s.week>=beforeWeek)return;
    var e=STATE.data[s.id];if(!e||!e.ex)return;
    for(var k in e.ex){if(e.ex[k]&&(!resWeek[k]||s.week>resWeek[k])){res[k]=e.ex[k];resWeek[k]=s.week;}}
  });
  return res;
}

// ── Derived ──────────────────────────────────────────────────────────────────
function getDerived(){
  var all=allSessions();
  var doneSes=all.filter(function(s){return STATE.data[s.id]&&STATE.data[s.id].done;});
  var countable=all.filter(function(s){return !s.optional&&s.type!=="race";});
  var doneCnt=doneSes.filter(function(s){return !s.optional&&s.type!=="race";}).length;
  var runKm=0,rowKm=0;
  all.forEach(function(s){
    var e=STATE.data[s.id];
    if(!e||!e.km)return;
    if(s.type==="rowing")rowKm+=parseFloat(e.km||0);
    else runKm+=parseFloat(e.km||0);
  });
  var pct=Math.round((doneCnt/countable.length)*100);
  var streak=calcStreak(STATE.data);
  var earnedRunB=RUN_BADGES.filter(function(b){return b.ok(STATE.data,doneSes,all,streak);});
  var earnedRowB=ROW_BADGES.filter(function(b){return b.ok(STATE.data,doneSes,all,streak);});
  var earnedKB=KRAFT_BADGES.filter(function(b){return b.ok(STATE.data,doneSes,all,streak);});
  var earnedB=earnedRunB.concat(earnedRowB).concat(earnedKB);
  var runChart=[],rowChart=[];
  for(var w=1;w<=WEEKS;w++){
    var ses=genSes(w);
    var runkm=ses.filter(function(s){return s.type!=="rowing";}).reduce(function(a,s){return a+parseFloat((STATE.data[s.id]&&STATE.data[s.id].km)||0);},0);
    var rowkm=ses.filter(function(s){return s.type==="rowing";}).reduce(function(a,s){return a+parseFloat((STATE.data[s.id]&&STATE.data[s.id].km)||0);},0);
    if(runkm>0)runChart.push({name:"W"+w,km:parseFloat(runkm.toFixed(1)),fill:PC[getPh(w).id]||"#FF7A3C"});
    if(rowkm>0)rowChart.push({name:"W"+w,km:parseFloat(rowkm.toFixed(1)),fill:"#22D3EE"});
  }
  var logged=all.filter(function(s){return (STATE.data[s.id]&&STATE.data[s.id].done)||(STATE.data[s.id]&&STATE.data[s.id].time);})
    .map(function(s){return Object.assign({},s,{entry:STATE.data[s.id]||{}});}).reverse();
  return {all:all,doneSes:doneSes,countable:countable,doneCnt:doneCnt,runKm:runKm,rowKm:rowKm,totalKm:runKm+rowKm,pct:pct,streak:streak,earnedB:earnedB,earnedRunB:earnedRunB,earnedRowB:earnedRowB,earnedKB:earnedKB,runChart:runChart,rowChart:rowChart,logged:logged};
}

// Erzeugt eine iCalendar-Datei und öffnet sie – auf dem iPhone landet der Termin
// direkt in der nativen Kalender-App, die dann von selbst erinnert.
function icsDt(d){ // lokale ("floating") Zeit ohne Zeitzone → bleibt bei der eingestellten Uhrzeit
  return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"T"+
         ("0"+d.getHours()).slice(-2)+("0"+d.getMinutes()).slice(-2)+"00";
}
function icsEsc(s){return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function icsUid(){return "hm-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"@hm2027";}
function vevent(o){ // {start,end,summary,desc,rrule,alarmMin}
  var e=["BEGIN:VEVENT","UID:"+icsUid(),"DTSTAMP:"+icsDt(new Date()),
    "DTSTART:"+icsDt(o.start),"DTEND:"+icsDt(o.end),"SUMMARY:"+icsEsc(o.summary)];
  if(o.desc)e.push("DESCRIPTION:"+icsEsc(o.desc));
  if(o.rrule)e.push("RRULE:"+o.rrule);
  if(o.alarmMin!=null)e=e.concat(["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(o.summary),"TRIGGER:-PT"+o.alarmMin+"M","END:VALARM"]);
  e.push("END:VEVENT");
  return e;
}
function downloadICS(name,events){
  var cal=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//HM2027//DE","CALSCALE:GREGORIAN","METHOD:PUBLISH"]
    .concat(events).concat(["END:VCALENDAR"]).join("\r\n");
  var blob=new Blob([cal],{type:"text/calendar;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";
  document.body.appendChild(a);a.click();
  setTimeout(function(){try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},4000);
}

  // Wochenfazit (sonntags)
  if(di===6&&w>=NEW_FROM&&dn>0){

    var kmRow=doneAll.filter(function(s){return s.type==="rowing";}).reduce(function(a,s){return a+parseFloat((STATE.data[s.id]||{}).km||0);},0);
    var rp=doneAll.map(function(s){return STATE.data[s.id];}).filter(function(e){return e&&e.rpe;});

    html+='<div style="font-size:12.5px;color:var(--mut)">🌤️ Wetter für deine nächste Einheit</div><button class="btn ghost" style="width:auto;padding:8px 13px;font-size:12px" id="getWeather">📍 Laden</button>';

  else if(STATE.weather.err){html+='<div style="font-size:12.5px;color:var(--mut)">'+esc(STATE.weather.err)+'</div><button class="btn ghost" style="width:auto;padding:8px 11px;font-size:12px" id="getWeather">↺</button>';}
  else{var wx=STATE.weather;
    html+='<div><div style="font-size:15px;font-weight:700">'+wx.desc+' '+wx.temp+'°C</div><div style="font-size:11px;color:var(--dim);margin-top:1px">💨 '+wx.wind+' km/h · 💧 '+wx.hum+'% · '+esc(wx.tip)+'</div></div>';
    html+='<button class="btn ghost" style="width:auto;padding:8px 11px;font-size:12px" id="getWeather">↺</button>';}
  html+='</div>';
  html+='</div>';
  return html;

// ── PLAN ─────────────────────────────────────────────────────────────────────
function hPlanPanel(){
  var curW=getCurWeek();
  var now=new Date(),diff=RACE_DATE-now;
  var days=Math.floor(diff/86400000),hrs=Math.floor((diff%86400000)/3600000);
  var mins=Math.floor((diff%3600000)/60000),secs=Math.floor((diff%60000)/1000);
  var html2='<div style="padding:12px 13px 0;max-width:520px;margin:0 auto">';
  html2+='<div class="card" style="background:radial-gradient(120% 160% at 80% -30%,rgba(255,122,60,.18),transparent 60%),var(--sur);text-align:center;border-color:rgba(255,122,60,.3)">';
  html2+='<div class="lbl" style="color:var(--acc)">🏁 Halbmarathon · 11. April 2027</div>';
  html2+='<div style="display:flex;justify-content:center;gap:8px;margin-top:10px">';
  [[days,"Tage"],[hrs,"Std."],[mins,"Min."],[secs,"Sek."]].forEach(function(x){
    html2+='<div style="background:var(--bg);border-radius:12px;padding:7px 8px;min-width:44px">';
    html2+='<div class="num" style="font-size:18px;font-weight:800;color:var(--acc2);line-height:1" data-countdown>'+x[0]+'</div>';
    html2+='<div style="font-size:9px;color:var(--dim);margin-top:3px">'+x[1]+'</div></div>';
  });
  html2+='</div></div>';
  html2+='<div class="seg"><button data-view="list" class="'+(STATE.planView==="list"?"active":"")+'">📋 Liste</button><button data-view="cal" class="'+(STATE.planView==="cal"?"active":"")+'">🗓️ Kalender</button></div>';
  html2+='</div>';
  if(STATE.planView==="cal")return html2+hCalendarPanel();
  var html='<div style="padding:0 13px 14px;max-width:520px;margin:0 auto">';
  html+='<div class="phase-filter">';
  html+='<button class="pill'+(STATE.phFilter===0?" active":"")+'" data-phfilter="0" style="'+(STATE.phFilter===0?"border-color:var(--acc);color:var(--acc);background:rgba(255,122,60,.12)":"")+'">Alle</button>';
  PHASES.forEach(function(p){
    var c=PC[p.id];
    html+='<button class="pill'+(STATE.phFilter===p.id?" active":"")+'" data-phfilter="'+p.id+'" style="'+(STATE.phFilter===p.id?"border-color:"+c+";color:"+c+";background:"+c+"22":"")+'">'+p.name+'</button>';
  });
  html+='</div>';
  for(var w=1;w<=WEEKS;w++){
    if(STATE.phFilter!==0&&getPh(w).id!==STATE.phFilter)continue;
    var ph=getPh(w),ses=genSes(w);
    var dn=ses.filter(function(s){return STATE.data[s.id]&&STATE.data[s.id].done;}).length;
    var isCur=w===curW,exp=STATE.expanded===w;
    var adj=w>=NEW_FROM?adjOf(w):null;
    html+='<div class="week-card'+(isCur?" current":"")+'">';
    html+='<button class="week-header" data-toggle="'+w+'">';
    html+='<div style="display:flex;align-items:center;gap:11px">';
    html+='<div style="width:3px;height:40px;background:'+PC[ph.id]+';border-radius:2px;flex-shrink:0"></div>';
    html+='<div><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
    html+='<span style="font-size:14px;font-weight:700">Woche '+w+'</span>';
    if(isCur)html+='<span style="font-size:10px;background:var(--grad);color:#1A0D04;padding:2px 8px;border-radius:999px;font-weight:800">JETZT</span>';
    if(TESTS[w])html+='<span class="zchip" style="background:#F472B622;color:#F472B6">⏱️ Testlauf</span>';
    if(adj&&adj.m!==1)html+='<span class="zchip" style="background:'+(adj.m<1?"#FBBF2422;color:#FBBF24":"#34D39922;color:#34D399")+'">'+(adj.m<1?"↓ angepasst":"↑ angehoben")+'</span>';
    if(dn===ses.length&&ses.length>0)html+='<span>✅</span>';
    html+='</div><div style="font-size:11px;color:var(--dim);margin-top:2px">'+wkRange(w)+' · '+ph.name+'</div>';
    html+='</div></div>';
    html+='<div style="display:flex;align-items:center;gap:8px">';
    html+='<span class="num" style="font-size:12px;color:'+(dn===ses.length?"var(--ok)":"var(--dim)")+'">'+dn+'/'+ses.length+'</span>';
    html+='<span style="font-size:15px;color:var(--dim);display:inline-block;transform:'+(exp?"rotate(180deg)":"none")+';transition:.15s">▾</span>';
    html+='</div></button>';
    if(exp){
      html+='<div style="border-top:1px solid var(--line);padding:8px 14px 12px">';
      if(adj&&adj.note)html+='<div class="coach" style="margin:8px 0 10px;font-size:12px"><b style="color:var(--acc2)">🧠 Coach:</b> '+esc(adj.note)+'</div>';
      ses.forEach(function(s,i){
        var entry=STATE.data[s.id]||{};
        var done=!!entry.done;
        html+='<div class="session-row" style="'+(done?"opacity:.7":"")+'">';
        html+='<button class="check-btn" data-check="'+esc(s.id)+'" data-week="'+w+'" style="border-color:'+(done?SC[s.type]:"var(--line2)")+';background:'+(done?SC[s.type]:"transparent")+'">'+(done?"✓":"")+'</button>';
        html+='<div style="flex:1;min-width:0">';

        if(s.day!=null)html+='<span class="zchip" style="background:var(--sur2);color:var(--mut)">'+DAYN[s.day]+'</span>';
        html+='<span>'+SI[s.type]+'</span>';
        html+='<span style="font-size:13px;font-weight:600;'+(done?"text-decoration:line-through;color:var(--mut)":"")+'">'+esc(s.title)+'</span>';
        if(s.examEased)html+='<span class="chip" style="padding:1px 7px;font-size:10px;color:var(--acc2);border-color:rgba(255,178,94,.4)">📚 optional</span>';
        else if(s.optional)html+='<span class="chip" style="padding:1px 7px;font-size:10px">optional</span>';
        if(entry.mood!=null)html+='<span style="font-size:14px">'+MOODS[entry.mood-1]+'</span>';
        html+='</div>';
        html+='<div style="font-size:11.5px;color:var(--mut);line-height:1.55">'+esc(s.desc)+(s.zone?" "+zoneChip(s.zone):"")+'</div>';
        if(entry.time||entry.km){
          var ex2=s.type==="rowing"?splitOf(entry):null;
          html+='<div style="font-size:11px;color:'+SC[s.type]+';margin-top:3px;font-weight:600">⏱ '+esc(entry.time||"")+(entry.km?" · "+esc(entry.km)+" km":"")+(ex2?" · Ø "+ex2:"")+(entry.rpe?" · "+entry.rpe+"/10":"")+(entry.notes?' · „'+esc(entry.notes)+'"':"")+'</div>';
        }
        html+='</div>';
        html+='<div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;margin-top:2px">';
        html+='<button style="padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mut);font-size:11px" data-open="'+esc(s.id)+'">'+(entry.time||entry.rpe?"✏️":"+ Log")+'</button>';
        if(sesRemindable(s,w))html+='<button style="padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mut);font-size:11px" data-cal="'+esc(s.id)+'" title="In den iPhone-Kalender">📅</button>';
        html+='</div>';
        html+='</div>';
      });
      html+='</div>';
    }
    html+='</div>';
  }
  html+='</div>';
  return html2+html;
}

// ── Kalender ─────────────────────────────────────────────────────────────────
function hCalendarPanel(){
  var year=STATE.calYear, month=STATE.calMonth;
  var monthNames=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var html='<div style="padding:0 13px 14px;max-width:520px;margin:0 auto">';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">';
  html+='<button data-calmonth="-1" class="pill">‹</button>';
  html+='<div class="disp" style="font-size:15px;font-weight:700">'+monthNames[month]+' '+year+'</div>';
  html+='<button data-calmonth="1" class="pill">›</button>';
  html+='</div>';
  var dayNames=DAYN;
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">';
  dayNames.forEach(function(d){html+='<div style="text-align:center;font-size:10px;color:var(--dim);padding:4px 0">'+d+'</div>';});
  html+='</div>';
  var firstDay=new Date(year,month,1).getDay();
  var firstMon=firstDay===0?6:firstDay-1;
  var daysInMonth=new Date(year,month+1,0).getDate();
  var weekDots={};
  for(var w=1;w<=WEEKS;w++){
    var wStart=new Date(PLAN_START);wStart.setDate(wStart.getDate()+(w-1)*7);
    genSes(w).forEach(function(s,i){
      var d=new Date(wStart);d.setDate(d.getDate()+(s.day!=null?s.day:Math.min(i,6)));
      var key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
      if(!weekDots[key])weekDots[key]=[];
      weekDots[key].push({type:s.type,done:STATE.data[s.id]&&STATE.data[s.id].done});
    });
  }
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
  for(var i=0;i<firstMon;i++){html+='<div></div>';}
  var today=new Date(),isThisMonth=(today.getMonth()===month&&today.getFullYear()===year);
  for(var day=1;day<=daysInMonth;day++){
    var key2=year+"-"+(month+1)+"-"+day;
    var dots2=weekDots[key2]||[];
    var isToday=isThisMonth&&today.getDate()===day;
    html+='<div style="background:var(--sur);border-radius:8px;padding:4px 2px;min-height:46px;border:1px solid '+(isToday?"var(--acc)":"var(--line)")+';text-align:center">';
    html+='<div class="num" style="font-size:10px;color:'+(isToday?"var(--acc)":"var(--dim)")+';font-weight:'+(isToday?800:400)+';margin-bottom:2px">'+day+'</div>';
    if(dots2.length>0){
      html+='<div style="display:flex;flex-wrap:wrap;gap:1px;justify-content:center">';
      dots2.slice(0,4).forEach(function(dot){
        var c=dot.done?SC[dot.type]||"var(--dim)":"var(--line)";
        html+='<div style="width:6px;height:6px;border-radius:50%;background:'+c+';border:1px solid '+(dot.done?"transparent":"var(--dim)")+'"></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  }
  html+='</div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;padding:10px" class="card flat">';
  [["easy","Lockerlauf"],["long","Langer Lauf"],["tempo","Tempo"],["test","Testlauf"],["strength","Kraft"],["rowing","Rudern"]].forEach(function(x){
    html+='<div style="display:flex;align-items:center;gap:4px">';
    html+='<div style="width:8px;height:8px;border-radius:50%;background:'+SC[x[0]]+'"></div>';
    html+='<span style="font-size:10px;color:var(--dim)">'+x[1]+'</span></div>';
  });
  html+='</div></div>';
  return html;
}

  if(a.lr){

    [[a.lr.acute,"Last 7 Tage"],[a.lr.chronic,"Ø-Woche (28 T.)"],[a.lr.r.toFixed(2),"Quote"]].forEach(function(x){
      html+='<div style="flex:1;background:var(--sur2);border-radius:11px;padding:10px 4px"><div class="num" style="font-size:15px;font-weight:800">'+x[0]+'</div><div style="font-size:10px;color:var(--dim);margin-top:2px">'+x[1]+'</div></div>';

    html+='</div>';
    html+='<div style="font-size:11px;color:var(--dim);margin-top:9px;line-height:1.5">Quote = akute Last ÷ chronische Last. Über 1,3 steigt das Verletzungsrisiko – der Coach reduziert dann automatisch.</div>';
  } else html+='<div style="font-size:12px;color:var(--dim);margin-top:8px">Noch zu wenig Daten – hake Einheiten mit Anstrengung (Check-in) ab, dann erscheint hier deine Belastungskurve.</div>';
  html+='</div>';
  // Badges

  html+=badgeBlock("🚣‍♀️ Ruder-Abzeichen",ROW_BADGES,d.earnedRowB,"rgba(56,189,248,.35)");
  html+=badgeBlock("💪 Kraft-Abzeichen",KRAFT_BADGES,d.earnedKB,"rgba(251,146,60,.35)");
  // Charts
  function chart(title,data,border){

function hKoerperPanel(){

    html+='<div class="card" style="text-align:center;color:var(--dim);font-size:13px">Noch kein Gewicht eingetragen.</div>';
  } else {
    var startW=weights[0].kg,curW=weights[weights.length-1].kg,diff=parseFloat((startW-curW).toFixed(1));
    var goal=57.0,toGoal=parseFloat((curW-goal).toFixed(1));
    html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
    [[curW+" kg","Aktuell","var(--acc2)"],[(diff>0?"-":"")+diff+" kg","Abgenommen",diff>0?"var(--ok)":"var(--dim)"],[toGoal+" kg","Bis Ziel (57 kg)","var(--vio)"]].forEach(function(x){
      html+='<div class="card flat" style="text-align:center;margin-bottom:0"><div class="num" style="font-size:16px;font-weight:800;color:'+x[2]+'">'+x[0]+'</div><div style="font-size:10px;color:var(--dim);margin-top:1px">'+x[1]+'</div></div>';
    });
    html+='</div>';
    if(weights.length>1){
      var minW=Math.min.apply(null,weights.map(function(x){return x.kg;}))-1;
      var maxW=Math.max.apply(null,weights.map(function(x){return x.kg;}))+1;
      html+='<div class="card"><div style="font-size:11px;color:var(--dim);margin-bottom:8px">Verlauf</div>';
      html+='<div style="display:flex;align-items:flex-end;gap:4px;height:80px;overflow-x:auto;padding-bottom:18px">';
      weights.forEach(function(x){
        var bh=Math.max(4,Math.round(((x.kg-minW)/(maxW-minW))*60));
        var col=x.kg<=startW?"var(--ok)":"var(--bad)";
        html+='<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:28px">';
        html+='<div style="font-size:8px;color:var(--dim);margin-bottom:2px">'+x.kg+'</div>';
        html+='<div style="width:20px;height:'+bh+'px;background:'+col+';border-radius:3px 3px 0 0"></div>';
        html+='<div style="font-size:7px;color:var(--dim);margin-top:2px;transform:rotate(-45deg);transform-origin:top left;width:22px">'+x.date.slice(5)+'</div>';
        html+='</div>';
      });
      html+='</div></div>';
    }
    html+='<div style="font-size:12px;color:var(--dim);margin-bottom:6px">Letzte Einträge</div>';
    weights.slice(-5).reverse().forEach(function(x){
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(36,48,70,.5)">';
      html+='<span style="font-size:13px;color:var(--dim)">'+x.date+'</span>';
      html+='<div style="display:flex;align-items:center;gap:10px">';
      html+='<span class="num" style="font-size:14px;font-weight:700">'+x.kg+' kg</span>';
      html+='<button data-delw="'+x.date+'" style="font-size:11px;color:var(--dim);background:none;border:none">✕</button>';
      html+='</div></div>';
    });
  }
  html+='<div style="font-size:15px;font-weight:700;margin:20px 0 12px">👣 Schritte täglich</div>';
  html+='<div class="card">';
  html+='<div style="display:flex;gap:10px;margin-bottom:10px">';
  html+='<div style="flex:1"><div style="font-size:11px;color:var(--dim);margin-bottom:4px">Datum</div><input type="date" id="sDate" value="'+STATE.sDate+'"></div>';
  html+='<div style="flex:1"><div style="font-size:11px;color:var(--dim);margin-bottom:4px">Schritte</div><input type="number" id="sInput" value="'+esc(STATE.sInput)+'" min="0" max="50000" placeholder="z. B. 10500"></div>';
  html+='</div>';
  html+='<button id="sSave" class="btn" style="background:linear-gradient(120deg,#38BDF8,#7DD3FC);color:#06283D">Schritte eintragen +</button>';
  html+='</div>';
  var steps=STATE.steps.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  if(steps.length===0){
    html+='<div class="card" style="text-align:center;color:var(--dim);font-size:13px">Noch keine Schritte eingetragen.</div>';
  } else {
    var goal10k=10000;
    var avgSteps=Math.round(steps.reduce(function(a,x){return a+x.steps;},0)/steps.length);
    var daysOver=steps.filter(function(x){return x.steps>=goal10k;}).length;
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">';
    html+='<div class="card flat" style="text-align:center;margin-bottom:0"><div class="num" style="font-size:16px;font-weight:800;color:var(--row)">'+avgSteps.toLocaleString("de-DE")+'</div><div style="font-size:10px;color:var(--dim);margin-top:1px">Ø Schritte/Tag</div></div>';
    html+='<div class="card flat" style="text-align:center;margin-bottom:0"><div class="num" style="font-size:16px;font-weight:800;color:var(--ok)">'+daysOver+'/'+steps.length+'</div><div style="font-size:10px;color:var(--dim);margin-top:1px">Tage ≥ 10.000</div></div>';
    html+='</div>';
    var last14=steps.slice(-14);
    html+='<div class="card"><div style="font-size:11px;color:var(--dim);margin-bottom:8px">Letzte '+last14.length+' Tage · Ziel: 10.000 ─ ─</div>';
    html+='<div style="display:flex;align-items:flex-end;gap:3px;height:90px;overflow-x:auto;padding-bottom:18px">';
    var maxS=Math.max.apply(null,last14.map(function(x){return x.steps;}).concat([goal10k]));
    last14.forEach(function(x){
      var bh=Math.max(4,Math.round((x.steps/maxS)*70));
      var goalH=Math.round((goal10k/maxS)*70);
      var col=x.steps>=goal10k?"var(--ok)":"var(--acc)";
      html+='<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:20px;position:relative">';
      html+='<div style="font-size:7px;color:var(--dim);margin-bottom:2px">'+(x.steps>=1000?Math.round(x.steps/1000)+"k":x.steps)+'</div>';
      html+='<div style="width:16px;height:'+bh+'px;background:'+col+';border-radius:3px 3px 0 0;position:relative">';
      if(bh<goalH)html+='<div style="position:absolute;top:-'+(goalH-bh)+'px;left:0;right:0;border-top:1px dashed var(--dim)"></div>';
      html+='</div>';
      html+='<div style="font-size:7px;color:var(--dim);margin-top:2px;transform:rotate(-45deg);transform-origin:top left;width:20px">'+x.date.slice(5)+'</div>';
      html+='</div>';
    });
    html+='</div></div>';
    html+='<div style="font-size:12px;color:var(--dim);margin-bottom:6px">Letzte Einträge</div>';
    steps.slice(-5).reverse().forEach(function(x){
      var pct=Math.min(100,Math.round((x.steps/goal10k)*100));
      html+='<div style="padding:8px 0;border-bottom:1px solid rgba(36,48,70,.5)">';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
      html+='<span style="font-size:13px;color:var(--dim)">'+x.date+'</span>';
      html+='<div style="display:flex;align-items:center;gap:10px">';
      html+='<span class="num" style="font-size:13px;font-weight:700;color:'+(x.steps>=goal10k?"var(--ok)":"var(--tx)")+'">'+x.steps.toLocaleString("de-DE")+'</span>';
      html+='<button data-dels="'+x.date+'" style="font-size:11px;color:var(--dim);background:none;border:none">✕</button>';
      html+='</div></div>';
      html+='<div style="height:4px;background:var(--line);border-radius:2px"><div style="height:100%;width:'+pct+'%;background:'+(x.steps>=goal10k?"var(--ok)":"var(--acc)")+';border-radius:2px"></div></div>';
      html+='</div>';
    });
  }
  html+='</div>';
  return html;
}

// ── Wetter ───────────────────────────────────────────────────────────────────
function fetchWeather(){
  if(STATE.weatherLoading)return;
  STATE.weatherLoading=true;render();
  if(!navigator.geolocation){STATE.weather={err:"Standort nicht verfügbar"};STATE.weatherLoading=false;render();return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lon=pos.coords.longitude;
    fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto")
      .then(function(r){return r.json();})
      .then(function(d){
        var c=d.current,code=c.weather_code;
        var desc=code===0?"☀️ Sonnig":code<=3?"⛅ Bewölkt":code<=48?"🌫️ Nebel":code<=55?"🌦️ Nieselregen":code<=65?"🌧️ Regen":code<=75?"❄️ Schnee":code<=82?"🌦️ Schauer":"⛈️ Gewitter";
        var tip=c.temperature_2m<5?"Warm anziehen · Handschuhe":c.temperature_2m>25?"Viel trinken · früh laufen":c.wind_speed_10m>30?"Gegenwind einplanen":"Gute Bedingungen";
        STATE.weather={temp:Math.round(c.temperature_2m),desc:desc,wind:Math.round(c.wind_speed_10m),hum:c.relative_humidity_2m,tip:tip};
        STATE.weatherLoading=false;render();
      }).catch(function(){STATE.weather={err:"Wetter nicht verfügbar"};STATE.weatherLoading=false;render();});
  },function(){STATE.weather={err:"Standort verweigert"};STATE.weatherLoading=false;render();});
}

    var mins=Math.floor((diff%3600000)/60000),secs=Math.floor((diff%60000)/1000);
    var els=document.querySelectorAll("[data-countdown]");

  document.querySelectorAll("[data-delw]").forEach(function(b){
    b.addEventListener("click",function(){
      STATE.weight=STATE.weight.filter(function(x){return x.date!==b.dataset.delw;});
      lsSet(LS_WEIGHT,STATE.weight);render();
    });
  });
  document.querySelectorAll("[data-dels]").forEach(function(b){
    b.addEventListener("click",function(){
      STATE.steps=STATE.steps.filter(function(x){return x.date!==b.dataset.dels;});
      lsSet(LS_STEPS,STATE.steps);render();
    });
  });
}

function bindSetup(){
  var sbSkip=document.getElementById("sbSkip");
  if(sbSkip)sbSkip.addEventListener("click",function(){STATE.cfg=false;lsSet(LS_CFG,false);render();});
  var sbConnect=document.getElementById("sbConnect");
  if(sbConnect)sbConnect.addEventListener("click",function(){
    var url=(document.getElementById("sbUrl")||{}).value||"";
    var key=(document.getElementById("sbKey")||{}).value||"";
    var userId=(document.getElementById("sbUid")||{}).value||mkUID();
    var errEl=document.getElementById("setupErr");
    if(!url||!key){if(errEl){errEl.style.display="block";errEl.textContent="Bitte URL und API-Key eingeben.";}return;}
    sbConnect.textContent="Verbinde…";sbConnect.disabled=true;
    initSupabase(function(lib){
      var fn=lib.createClient||(lib.default&&lib.default.createClient);
      if(!fn){if(errEl){errEl.style.display="block";errEl.textContent="Supabase konnte nicht geladen werden.";}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;return;}
      try{
        var sb=fn(url,key);
        sb.from(TABLE).upsert({user_id:userId,data:{}}).then(function(res){
          if(res.error){if(errEl){errEl.style.display="block";errEl.textContent="Fehler: "+res.error.message;}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;}
          else{STATE.cfg={url:url,key:key,userId:userId};lsSet(LS_CFG,STATE.cfg);connectSupabase();render();}
        }).catch(function(e){if(errEl){errEl.style.display="block";errEl.textContent="Fehler: "+e.message;}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;});
      }catch(e){if(errEl){errEl.style.display="block";errEl.textContent="Fehler: "+e.message;}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;}
    });
  });
}

// ── Einmaliger Neustart: alle Trainingsdaten zurücksetzen (Profil bleibt) ─────
(function(){
  if(STATE.data[RESET_KEY])return;
  var prof=STATE.data.profile;
  STATE.data={};
  STATE.data[RESET_KEY]=true;
  if(prof)STATE.data.profile=prof;
  lsSet(LS_DATA,STATE.data);invalidateFit();
})();

// ── Boot ─────────────────────────────────────────────────────────────────────
window.addEventListener("resize",function(){
  var w=window.innerWidth>=880;
  if(w!==STATE.wide)render();
});
render();
if(STATE.cfg)connectSupabase();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏃‍♀️ Halbmarathon 2027</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080c14;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:80px}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.tab-btn{flex:1;padding:10px 0;background:none;border:none;border-bottom:2px solid transparent;color:#64748b;font-size:12px;font-weight:400;cursor:pointer}
.tab-btn.active{border-bottom-color:#f97316;color:#f1f5f9;font-weight:700}
.week-card{margin-bottom:8px;border-radius:12px;border:1px solid #1e2d45;overflow:hidden;background:#141d2e}
.week-card.current{border-color:#f97316}
.week-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:none;border:none;color:#f1f5f9;cursor:pointer;text-align:left}
.session-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #1e2d4540}
.session-row:last-child{border-bottom:none}
.check-btn{width:22px;height:22px;border-radius:6px;flex-shrink:0;margin-top:2px;border:2px solid #1e2d45;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.badge-card{border-radius:10px;padding:11px 12px;border:1px solid #1e2d45;opacity:0.4;transition:opacity .3s}
.badge-card.earned{opacity:1;border-color:#f9731635;background:#141d2e}
.pill{padding:5px 13px;border-radius:20px;border:1px solid #1e2d45;background:#141d2e;color:#64748b;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:400}
.pill.active{font-weight:600}
.phase-filter{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0 16px}
.modal-box{background:#0f1623;border-radius:18px 18px 0 0;padding:20px 20px 36px;width:100%;max-width:480px;border:1px solid #1e2d45;border-bottom:none}
.mood-btn{flex:1;font-size:22px;padding:8px 0;border-radius:10px;border:2px solid #1e2d45;background:none;cursor:pointer}
.mood-btn.selected{border-color:#f97316;background:#7c2d0c30}
input[type=text]{width:100%;padding:11px 13px;background:#141d2e;border:1px solid #1e2d45;border-radius:9px;color:#f1f5f9;font-size:14px;outline:none}
.bar-chart{display:flex;align-items:flex-end;gap:3px;height:140px;overflow-x:auto;padding-bottom:24px;padding-top:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:20px}
.bar-label-top{font-size:8px;color:#64748b}
.bar-rect{width:16px;border-radius:3px 3px 0 0;transition:height .3s}
.bar-label-bot{font-size:8px;color:#64748b;transform:rotate(-45deg);transform-origin:top left;width:24px;margin-top:2px}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;top:-20px;border-radius:50%;animation:fall ease-in forwards;pointer-events:none}
.confetti-msg{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:999}
@media(min-width:768px){
  body{padding-bottom:20px}
  .layout{display:grid;grid-template-columns:1fr 1fr;max-width:1200px;margin:0 auto}
  .left-col{border-right:1px solid #1e2d45;min-height:100vh}
  .badge-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Config ──────────────────────────────────────────────────────────────────
var PLAN_START = new Date(2026,4,4);
var RACE_DATE  = new Date(2027,3,11);
var LS_DATA    = "hm-data";
var LS_CFG     = "hm-cfg";
var TABLE      = "hm_training";
var SB_URL     = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";

var PC={1:"#60a5fa",2:"#34d399",3:"#fbbf24",4:"#f87171",5:"#c084fc"};
var SC={easy:"#60a5fa",long:"#34d399",tempo:"#fbbf24",strength:"#fb923c",recovery:"#c084fc",race:"#f97316",rowing:"#38bdf8"};
var SI={easy:"🏃‍♀️",long:"🛤️",tempo:"⚡",strength:"💪",recovery:"🌿",race:"🏅",rowing:"🚣‍♀️"};
var MOODS=["😫","😕","😊","💪","🚀"];

var PHASES=[
  {id:1,name:"Fundament",wStart:1,wEnd:12},
  {id:2,name:"Basis",wStart:13,wEnd:24},
  {id:3,name:"Qualität",wStart:25,wEnd:36},
  {id:4,name:"Race Prep",wStart:37,wEnd:46},
  {id:5,name:"Tapering",wStart:47,wEnd:49},
];

var BADGES=[
  {id:"first", icon:"🚀", name:"Erste Schritte",  desc:"Erste Einheit abgehakt",          ok:function(d,ds){return ds.length>=1;}},
  {id:"5km",   icon:"📏", name:"5 km Marke",       desc:"5 km in einer Einheit",           ok:function(d){return Object.values(d).some(function(e){return parseFloat((e&&e.km)||0)>=5;});}},
  {id:"10km",  icon:"🏅", name:"10 km Marke",      desc:"10 km in einer Einheit",          ok:function(d){return Object.values(d).some(function(e){return parseFloat((e&&e.km)||0)>=10;});}},
  {id:"15km",  icon:"🛤️",name:"15 km Hürde",      desc:"15 km in einer Einheit",          ok:function(d){return Object.values(d).some(function(e){return parseFloat((e&&e.km)||0)>=15;});}},
  {id:"tempo", icon:"⚡", name:"Tempo-Läuferin",   desc:"Ersten Tempolauf absolviert",     ok:function(d,ds){return ds.some(function(s){return s.type==="tempo";});}},
  {id:"row10", icon:"🚣‍♀️",name:"Ruder-Königin",  desc:"10 Ruder-Einheiten absolviert",  ok:function(d,ds){return ds.filter(function(s){return s.type==="rowing";}).length>=10;}},
  {id:"s10",   icon:"💪", name:"10 Einheiten",     desc:"10 Einheiten abgehakt",           ok:function(d,ds){return ds.filter(function(s){return s.type!=="race";}).length>=10;}},
  {id:"s25",   icon:"🌟", name:"25 Einheiten",     desc:"25 Einheiten abgehakt",           ok:function(d,ds){return ds.filter(function(s){return s.type!=="race";}).length>=25;}},
  {id:"str3",  icon:"🔥", name:"3 Wochen Streak",  desc:"3 Wochen vollständig",            ok:function(d,ds,all,sk){return sk>=3;}},
  {id:"str5",  icon:"🔥🔥",name:"5 Wochen Streak", desc:"5 Wochen vollständig",            ok:function(d,ds,all,sk){return sk>=5;}},
  {id:"ph1",   icon:"1️⃣",name:"Phase 1 ✓",        desc:"Fundament-Phase abgeschlossen",   ok:function(d,ds,all){var p=all.filter(function(s){return getPh(s.week).id===1&&!s.optional&&s.type!=="race";});return p.length>0&&p.every(function(s){return d[s.id]&&d[s.id].done;});}},
  {id:"half",  icon:"💯", name:"Halbzeit!",         desc:"50% des Plans absolviert",        ok:function(d,ds,all){var c=all.filter(function(s){return !s.optional&&s.type!=="race";}).length;return ds.filter(function(s){return !s.optional&&s.type!=="race";}).length>=c/2;}},
];

// ── Helpers ──────────────────────────────────────────────────────────────────
function getPh(w){return PHASES.find(function(p){return w>=p.wStart&&w<=p.wEnd;})||PHASES[4];}
function lerp(a,b,t){return Math.round(a+(b-a)*Math.max(0,Math.min(1,t)));}
function getCurWeek(){var ms=new Date().getTime()-PLAN_START.getTime();return Math.max(1,Math.min(49,Math.floor(ms/(7*24*3600*1000))+1));}
function daysLeft(){return Math.max(0,Math.ceil((RACE_DATE.getTime()-new Date().getTime())/(24*3600*1000)));}
function wkRange(w){
  var s=new Date(PLAN_START);s.setDate(s.getDate()+(w-1)*7);
  var e=new Date(s);e.setDate(e.getDate()+6);
  function f(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"short"});}
  return f(s)+" – "+f(e);
}
function mkUID(){return "u-"+Math.random().toString(36).slice(2,10);}
function lsGet(k,fb){try{var r=localStorage.getItem(k);return r?JSON.parse(r):(fb!==undefined?fb:null);}catch(e){return fb!==undefined?fb:null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function rowSes(w,t){return [
  {id:"w"+w+"-r1",type:"rowing",title:"Rudern – Ausdauer",  desc:lerp(20,45,t)+" Min gleichmäßig · Technik & Grundlage · schont Beckenboden"},
  {id:"w"+w+"-r2",type:"rowing",title:"Rudern – Intervall", desc:"5 Min Einfahren · "+lerp(3,8,t)+"×2 Min zügig · 1 Min Pause · Ausfahren (~"+lerp(20,40,t)+" Min)"},
];}

function genSes(w){
  var ph=getPh(w),t=(w-ph.wStart)/Math.max(ph.wEnd-ph.wStart,1);
  if(ph.id===1)return [{id:"w"+w+"-1",type:"easy",title:"Lockerlauf + Beckenboden",desc:lerp(25,35,t)+" Min Wohlfühltempo · Beckenboden-Aktivierung (10 Min)"},
    {id:"w"+w+"-2",type:"strength",title:"Lauf + Kräftigung",desc:lerp(25,30,t)+" Min locker · Core, Gesäß & Hüfte (20 Min)"}].concat(rowSes(w,t));
  if(ph.id===2){var lm=lerp(40,70,t);return [{id:"w"+w+"-1",type:"easy",title:"Lockerlauf",desc:lerp(35,40,t)+" Min locker"},
    {id:"w"+w+"-2",type:"strength",title:"Lauf + Kraft",desc:lerp(30,35,t)+" Min locker · Core-Kräftigung"},
    {id:"w"+w+"-3",type:"long",title:"Langer Lauf",desc:lm+" Min sehr locker (~"+Math.round(lm/5.8)+" km)"}].concat(rowSes(w,t));}
  if(ph.id===3){var lm3=lerp(60,90,t),iv=t<0.5?"4×6 Min @ 4:58/km":"5×8 Min @ 4:58/km";
    return [{id:"w"+w+"-1",type:"easy",title:"Lockerlauf",desc:lerp(40,45,t)+" Min locker"},
      {id:"w"+w+"-2",type:"tempo",title:"Tempolauf",desc:"10 Min Einlaufen · "+iv+" · 10 Min Auslaufen"},
      {id:"w"+w+"-3",type:"long",title:"Langer Lauf",desc:lm3+" Min locker (~"+Math.round(lm3/5.5)+" km)"},
      {id:"w"+w+"-4",type:"recovery",title:"Regeneration (opt.)",desc:"30 Min sehr locker · Stretching",optional:true}].concat(rowSes(w,t));}
  if(ph.id===4){var km4=lerp(14,19,t);return [{id:"w"+w+"-1",type:"easy",title:"Lockerlauf",desc:"40 Min locker"},
    {id:"w"+w+"-2",type:"tempo",title:"Renntempo",desc:"10 Min Einlaufen · "+lerp(25,35,t)+" Min @ 4:58/km · 10 Min Auslaufen"},
    {id:"w"+w+"-3",type:"long",title:"Langer Lauf",desc:km4+" km locker (~"+Math.round(km4*5.5)+" Min)"},
    {id:"w"+w+"-4",type:"recovery",title:"Regenerationslauf",desc:"30 Min sehr locker"}].concat(rowSes(w,t));}
  if(w===49)return [{id:"w49-1",type:"easy",title:"Leichte Aktivierung",desc:"20 Min sehr locker · Beine frisch halten"},
    {id:"w49-race",type:"race",title:"🏅 HALBMARATHON!",desc:"11. April 2027 · Ziel: unter 1:45:00 · Du hast es dir verdient!"}];
  var tp=w===47?0:0.5;
  return [{id:"w"+w+"-1",type:"easy",title:"Lockerlauf",desc:lerp(35,25,tp)+" Min locker"},
    {id:"w"+w+"-2",type:"tempo",title:"Kurzes Tempotraining",desc:lerp(30,20,tp)+" Min Renntempo-Abschnitte"},
    {id:"w"+w+"-3",type:"easy",title:"Lockerlauf",desc:lerp(30,20,tp)+" Min sehr locker"},
    {id:"w"+w+"-r1",type:"rowing",title:"Rudern – locker",desc:"20 Min locker · Beine schonen"}];
}

function allSessions(){var a=[];for(var w=1;w<=49;w++)genSes(w).forEach(function(s){a.push(Object.assign({},s,{week:w}));});return a;}
var ALL_SES = allSessions();

function calcStreak(data){
  var cur=getCurWeek(),streak=0;
  for(var w=cur;w>=1;w--){
    var req=genSes(w).filter(function(s){return !s.optional&&s.type!=="race";});
    if(req.length>0&&req.every(function(s){return data[s.id]&&data[s.id].done;})){streak++;}
    else{break;}
  }
  return streak;
}
function parseDur(str){
  if(!str)return null;
  var p=str.trim().split(":").map(Number);
  if(p.some(isNaN)||p.length<2)return null;
  return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];
}
function fmtPace(s){var m=Math.floor(s/60),sc=Math.round(s%60);return m+":"+(("0"+sc).slice(-2));}
function fmtTime(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=Math.round(s%60);return h>0?h+":"+(("0"+m).slice(-2))+":"+(("0"+sc).slice(-2)):m+":"+(("0"+sc).slice(-2));}

// ── State ────────────────────────────────────────────────────────────────────
var STATE = {
  data:      lsGet(LS_DATA, {}),
  cfg:       lsGet(LS_CFG),
  tab:       "plan",
  dtab:      "stats",
  expanded:  getCurWeek(),
  phFilter:  0,
  modal:     null,
  formTime:  "", formKm: "", formNotes: "", formMood: null,
  syncSt:    "idle",
  sbClient:  null,
  syncTimer: null,
  wide:      window.innerWidth >= 768,
};

// ── Supabase (lazy load) ──────────────────────────────────────────────────────
function initSupabase(cb){
  if(window.supabase){cb(window.supabase);return;}
  var s=document.createElement("script");
  s.src=SB_URL;
  s.onload=function(){cb(window.supabase||{});};
  s.onerror=function(){cb({});};
  document.head.appendChild(s);
}

function connectSupabase(){
  if(!STATE.cfg)return;
  initSupabase(function(lib){
    var fn=lib.createClient||(lib.default&&lib.default.createClient);
    if(!fn)return;
    STATE.sbClient=fn(STATE.cfg.url,STATE.cfg.key);
    loadFromSupabase();
  });
}

function loadFromSupabase(){
  if(!STATE.sbClient||!STATE.cfg)return;
  STATE.syncSt="syncing";render();
  STATE.sbClient.from(TABLE).select("data").eq("user_id",STATE.cfg.userId).single()
    .then(function(res){
      if(!res.error&&res.data&&res.data.data&&Object.keys(res.data.data).length>0){
        STATE.data=res.data.data;lsSet(LS_DATA,STATE.data);
      }
      STATE.syncSt="ok";render();
    }).catch(function(){STATE.syncSt="error";render();});
}

function syncToSupabase(){
  if(!STATE.sbClient||!STATE.cfg)return;
  clearTimeout(STATE.syncTimer);
  STATE.syncTimer=setTimeout(function(){
    STATE.syncSt="syncing";render();
    STATE.sbClient.from(TABLE).upsert({user_id:STATE.cfg.userId,data:STATE.data})
      .then(function(res){STATE.syncSt=res.error?"error":"ok";render();})
      .catch(function(){STATE.syncSt="error";render();});
  },1200);
}

// ── Data helpers ──────────────────────────────────────────────────────────────
function saveData(){lsSet(LS_DATA,STATE.data);syncToSupabase();}

function toggleSession(id,week){
  var prev=STATE.data[id]&&STATE.data[id].done;
  if(!STATE.data[id])STATE.data[id]={};
  STATE.data[id].done=!prev;
  if(!prev){
    var req=genSes(week).filter(function(s){return !s.optional&&s.type!=="race";});
    if(req.every(function(s){return STATE.data[s.id]&&STATE.data[s.id].done;})){showConfetti();}
  }
  saveData();render();
}

function openModal(sid){
  var e=STATE.data[sid]||{};
  STATE.modal=sid;
  STATE.formTime=e.time||"";STATE.formKm=e.km||"";STATE.formNotes=e.notes||"";STATE.formMood=e.mood!=null?e.mood:null;
  render();
}

function submitModal(){
  if(!STATE.modal)return;
  if(!STATE.data[STATE.modal])STATE.data[STATE.modal]={};
  STATE.data[STATE.modal].done=true;
  STATE.data[STATE.modal].time=STATE.formTime;
  STATE.data[STATE.modal].km=STATE.formKm;
  STATE.data[STATE.modal].notes=STATE.formNotes;
  STATE.data[STATE.modal].mood=STATE.formMood;
  STATE.modal=null;
  saveData();render();
}

// ── Confetti ──────────────────────────────────────────────────────────────────
function showConfetti(){
  var container=document.createElement("div");
  container.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden";
  var colors=["#f97316","#22c55e","#60a5fa","#fbbf24","#f87171","#c084fc"];
  for(var i=0;i<60;i++){
    var p=document.createElement("div");
    var sz=5+Math.random()*9;
    p.style.cssText="position:absolute;left:"+Math.random()*100+"%;top:-20px;width:"+sz+"px;height:"+sz+"px;background:"+colors[i%colors.length]+";border-radius:"+(Math.random()>0.4?"50%":"3px")+";animation:fall "+(1.4+Math.random()*0.9)+"s "+(Math.random()*0.9)+"s ease-in forwards";
    container.appendChild(p);
  }
  var msg=document.createElement("div");
  msg.className="confetti-msg";
  msg.innerHTML='<div style="font-size:52px;margin-bottom:8px">🎉</div><div style="font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 20px #f97316;white-space:nowrap">Woche abgeschlossen!</div>';
  container.appendChild(msg);
  document.body.appendChild(container);
  setTimeout(function(){document.body.removeChild(container);},4200);
}

// ── Derived ───────────────────────────────────────────────────────────────────
function getDerived(){
  var doneSes=ALL_SES.filter(function(s){return STATE.data[s.id]&&STATE.data[s.id].done;});
  var countable=ALL_SES.filter(function(s){return !s.optional&&s.type!=="race";});
  var doneCnt=doneSes.filter(function(s){return !s.optional&&s.type!=="race";}).length;
  var totalKm=Object.values(STATE.data).reduce(function(a,d){return a+parseFloat((d&&d.km)||0);},0);
  var pct=Math.round((doneCnt/countable.length)*100);
  var streak=calcStreak(STATE.data);
  var earnedB=BADGES.filter(function(b){return b.ok(STATE.data,doneSes,ALL_SES,streak);});
  var chartData=[];
  for(var w=1;w<=49;w++){
    var km=genSes(w).reduce(function(a,s){return a+parseFloat((STATE.data[s.id]&&STATE.data[s.id].km)||0);},0);
    if(km>0)chartData.push({name:"W"+w,km:parseFloat(km.toFixed(1)),fill:PC[getPh(w).id]||"#f97316"});
  }
  var logged=ALL_SES.filter(function(s){return (STATE.data[s.id]&&STATE.data[s.id].done)||(STATE.data[s.id]&&STATE.data[s.id].time);})
    .map(function(s){return Object.assign({},s,{entry:STATE.data[s.id]||{}});}).reverse();
  return {doneSes:doneSes,countable:countable,doneCnt:doneCnt,totalKm:totalKm,pct:pct,streak:streak,earnedB:earnedB,chartData:chartData,logged:logged};
}

// ── HTML builders ─────────────────────────────────────────────────────────────
function hHeader(d){
  var syncIcon=STATE.syncSt==="syncing"?"⏳":STATE.syncSt==="ok"?"☁️✓":STATE.syncSt==="error"?"☁️✗":STATE.cfg?"☁️":"💾";
  var syncColor=STATE.syncSt==="error"?"#f87171":STATE.syncSt==="ok"?"#22c55e":"#64748b";
  var curW=getCurWeek();
  return '<div style="background:#0f1623;border-bottom:1px solid #1e2d45;padding:16px 16px 0;position:sticky;top:0;z-index:50">'+
    '<div style="max-width:480px;margin:0 auto">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'+
      '<div>'+
        '<div style="font-size:18px;font-weight:800;letter-spacing:-0.5px">🏃‍♀️ Halbmarathon 2027</div>'+
        '<div style="font-size:12px;color:#64748b;margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+
          '<span>Noch <strong style="color:#f97316">'+daysLeft()+'</strong> Tage</span>'+
          '<span style="color:#1e2d45">·</span>'+
          '<span>'+getPh(curW).name+'</span>'+
          (d.streak>0?'<span style="background:#7c2d0c30;border:1px solid #f9731640;color:#f97316;border-radius:10px;padding:1px 7px;font-weight:700;font-size:11px">🔥 '+d.streak+'W</span>':'')+
          (d.earnedB.length>0?'<span style="background:#78350f30;border:1px solid #fbbf2440;color:#fbbf24;border-radius:10px;padding:1px 7px;font-weight:700;font-size:11px">🏅 '+d.earnedB.length+'</span>':'')+
          '<span style="font-size:11px;color:'+syncColor+'">'+syncIcon+'</span>'+
        '</div>'+
      '</div>'+
      '<div style="text-align:right;flex-shrink:0">'+
        '<div style="font-size:26px;font-weight:900;color:#f97316;line-height:1">'+d.pct+'%</div>'+
        '<div style="font-size:10px;color:#64748b">absolviert</div>'+
      '</div>'+
    '</div>'+
    '<div style="height:5px;background:#1e2d45;border-radius:3px;margin-bottom:12px;overflow:hidden">'+
      '<div style="height:100%;width:'+d.pct+'%;background:linear-gradient(90deg,#f97316,#ef4444);border-radius:3px;transition:width .6s"></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:14px">'+
      [["Einheiten ✓",d.doneCnt+"/"+d.countable.length],["KM gelaufen",d.totalKm.toFixed(0)+" km"],["Woche",getCurWeek()+"/49"]].map(function(s){
        return '<div style="flex:1;background:#141d2e;border-radius:10px;padding:9px 10px;border:1px solid #1e2d45">'+

    });
    html+='</div>';
    if(STATE.dtab==="stats")html+=hStatsPanel(d);
    else if(STATE.dtab==="zeiten")html+=hZeitenPanel(d);
    else html+=hTippsPanel();
    html+='</div>';
    html+='</div>';
  } else {
    if(STATE.tab==="plan")html+=hPlanPanel();
    else if(STATE.tab==="stats")html+=hStatsPanel(d);
    else if(STATE.tab==="zeiten")html+=hZeitenPanel(d);
    else html+=hTippsPanel();
  }
  html+=hModal();
  app.innerHTML=html;
  bindEvents();
}

// ── Event binding ─────────────────────────────────────────────────────────────
function bindEvents(){
  // Tab buttons
  document.querySelectorAll("[data-tab]").forEach(function(b){
    b.addEventListener("click",function(){STATE.tab=b.dataset.tab;render();});
  });
  document.querySelectorAll("[data-dtab]").forEach(function(b){
    b.addEventListener("click",function(){STATE.dtab=b.dataset.dtab;render();});
  });
  // Phase filter
  document.querySelectorAll("[data-phfilter]").forEach(function(b){
    b.addEventListener("click",function(){STATE.phFilter=parseInt(b.dataset.phfilter);render();});
  });
  // Week toggle
  document.querySelectorAll("[data-toggle]").forEach(function(b){
    b.addEventListener("click",function(){
      var w=parseInt(b.dataset.toggle);
      STATE.expanded=STATE.expanded===w?null:w;render();
    });
  });
  // Check session
  document.querySelectorAll("[data-check]").forEach(function(b){
    b.addEventListener("click",function(e){e.stopPropagation();toggleSession(b.dataset.check,parseInt(b.dataset.week));});
  });
  // Open modal
  document.querySelectorAll("[data-open]").forEach(function(b){
    b.addEventListener("click",function(e){e.stopPropagation();openModal(b.dataset.open);});
  });
  // Modal
  var overlay=document.getElementById("modalOverlay");
  if(overlay)overlay.addEventListener("click",function(e){if(e.target===overlay){STATE.modal=null;render();}});
  var cancel=document.getElementById("modalCancel");
  if(cancel)cancel.addEventListener("click",function(){STATE.modal=null;render();});
  var save=document.getElementById("modalSave");
  if(save)save.addEventListener("click",function(){
    STATE.formTime=(document.getElementById("mTime")||{}).value||"";
    STATE.formKm=(document.getElementById("mKm")||{}).value||"";
    STATE.formNotes=(document.getElementById("mNotes")||{}).value||"";
    submitModal();
  });
  document.querySelectorAll("[data-mood]").forEach(function(b){
    b.addEventListener("click",function(){STATE.formMood=parseInt(b.dataset.mood)+1;
      document.querySelectorAll(".mood-btn").forEach(function(x){x.classList.remove("selected");});
      b.classList.add("selected");
    });
  });
  // Pace
  var calcBtn=document.getElementById("calcPaceBtn");
  if(calcBtn)calcBtn.addEventListener("click",function(){
    STATE.paceTime=(document.getElementById("paceTime")||{}).value||"";
    STATE.paceKm=(document.getElementById("paceKm")||{}).value||"";
    var sec=parseDur(STATE.paceTime),km=parseFloat(STATE.paceKm);
    if(!sec||!km||km<=0){STATE.paceResult=null;}
    else{var ppk=sec/km;STATE.paceResult={pace:fmtPace(ppk),k5:fmtTime(ppk*5),k10:fmtTime(ppk*10),hm:fmtTime(ppk*21.0975)};}
    render();
  });
  // Resize
  window.addEventListener("resize",function(){render();},{once:true});
}

function bindSetup(){
  var sbSkip=document.getElementById("sbSkip");
  if(sbSkip)sbSkip.addEventListener("click",function(){STATE.cfg=false;lsSet(LS_CFG,false);render();});
  var sbConnect=document.getElementById("sbConnect");
  if(sbConnect)sbConnect.addEventListener("click",function(){
    var url=(document.getElementById("sbUrl")||{}).value||"";
    var key=(document.getElementById("sbKey")||{}).value||"";
    var userId=(document.getElementById("sbUid")||{}).value||mkUID();
    var errEl=document.getElementById("setupErr");
    if(!url||!key){if(errEl){errEl.style.display="block";errEl.textContent="Bitte URL und API-Key eingeben.";}return;}
    sbConnect.textContent="Verbinde…";sbConnect.disabled=true;
    initSupabase(function(lib){
      var fn=lib.createClient||(lib.default&&lib.default.createClient);
      if(!fn){if(errEl){errEl.style.display="block";errEl.textContent="Supabase konnte nicht geladen werden.";}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;return;}
      try{
        var sb=fn(url,key);
        sb.from(TABLE).upsert({user_id:userId,data:{}}).then(function(res){
          if(res.error){if(errEl){errEl.style.display="block";errEl.textContent="Fehler: "+res.error.message;}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;}
          else{STATE.cfg={url:url,key:key,userId:userId};lsSet(LS_CFG,STATE.cfg);connectSupabase();render();}
        }).catch(function(e){if(errEl){errEl.style.display="block";errEl.textContent="Fehler: "+e.message;}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;});
      }catch(e){if(errEl){errEl.style.display="block";errEl.textContent="Fehler: "+e.message;}sbConnect.textContent="Verbinden & starten →";sbConnect.disabled=false;}
    });
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener("resize",function(){render();});
render();
if(STATE.cfg)connectSupabase();
</script>
